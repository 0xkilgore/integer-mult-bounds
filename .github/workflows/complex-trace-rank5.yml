name: Complex trace rank-five certificate

on:
  pull_request:
    paths:
      - 'research/complex-trace-rank5/**'
      - '.github/workflows/complex-trace-rank5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct, admit and assemble
        run: python -B research/complex-trace-rank5/verify.py --work "$RUNNER_TEMP/rank5-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank5-receipts-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/rank5-replay/*.json
            ${{ runner.temp }}/rank5-replay/*.log
            ${{ runner.temp }}/rank5-replay/physical/RECEIPT.json
            ${{ runner.temp }}/rank5-replay/physical/RESULT.json
