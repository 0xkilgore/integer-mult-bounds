name: Selected family 588 finite composition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/e8-bit-r420/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/direct-delivery504-global/**'
      - 'research/complex-571-free4fc8/**'
      - 'research/complex-multicold/**'
      - 'research/larger-gain/**'
      - 'research/structural-gain/**'
      - 'research/complex-joint-prefix/**'
      - 'research/kernel-frame-coalescing/**'
      - 'scripts/verify_frontier588*.py'
      - 'scripts/verify_selected_result.py'
      - 'certificates/selected-result.json'
      - 'research/community-family588-audit/SELECTED-SOURCE.json'
      - 'Makefile'
      - '.github/workflows/frontier588.yml'
  push:
    branches: [main]
    paths:
      - 'research/e8-bit-r420/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/direct-delivery504-global/**'
      - 'research/complex-571-free4fc8/**'
      - 'research/complex-multicold/**'
      - 'research/larger-gain/**'
      - 'research/structural-gain/**'
      - 'research/complex-joint-prefix/**'
      - 'research/kernel-frame-coalescing/**'
      - 'scripts/verify_frontier588*.py'
      - 'scripts/verify_selected_result.py'
      - 'certificates/selected-result.json'
      - 'research/community-family588-audit/SELECTED-SOURCE.json'
      - 'Makefile'
      - '.github/workflows/frontier588.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install numpy sympy scipy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
      - name: Check selected record and review evidence
        run: |
          python -B scripts/verify_selected_result.py
          python -B scripts/verify_pr_reconciliation.py
      - name: Cold finite replay and exact composition binding
        env:
          CXX: g++
          BOOST_INCLUDE: /usr/include
        run: python -B scripts/verify_frontier588.py --work "$RUNNER_TEMP/frontier588" --jobs 2
      - name: Require committed files unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier588-linux-python312
          path: |
            ${{ runner.temp }}/frontier588/RESULT.json
            ${{ runner.temp }}/frontier588/STEPS.json
            ${{ runner.temp }}/frontier588/*.log
            ${{ runner.temp }}/frontier588/complex/RESULT.json
            ${{ runner.temp }}/frontier588/complex/RECEIPT.json
            ${{ runner.temp }}/frontier588/complex/STAGES.json
            ${{ runner.temp }}/frontier588/complex/ASSEMBLY.json
