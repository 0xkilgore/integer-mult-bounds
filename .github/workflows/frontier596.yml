name: Selected family 596 finite composition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/e8-bit-r420/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/direct-delivery504-global/**'
      - 'research/complex-571-hpeq5/**'
      - 'research/complex-multicold/**'
      - 'research/promoted-kernel-coalescing/vendor/larger_gain/**'
      - 'research/structural-gain/**'
      - 'research/complex-joint-prefix/**'
      - 'research/kernel-frame-coalescing/**'
      - 'scripts/verify_frontier596*.py'
      - 'scripts/verify_selected_result.py'
      - 'certificates/selected-result.json'
      - 'research/community-hyperplane599-audit/SELECTED-SOURCE.json'
      - 'Makefile'
      - '.github/workflows/frontier596.yml'
  push:
    branches: [main]
    paths:
      - 'research/e8-bit-r420/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/direct-delivery504-global/**'
      - 'research/complex-571-hpeq5/**'
      - 'research/complex-multicold/**'
      - 'research/promoted-kernel-coalescing/vendor/larger_gain/**'
      - 'research/structural-gain/**'
      - 'research/complex-joint-prefix/**'
      - 'research/kernel-frame-coalescing/**'
      - 'scripts/verify_frontier596*.py'
      - 'scripts/verify_selected_result.py'
      - 'certificates/selected-result.json'
      - 'research/community-hyperplane599-audit/SELECTED-SOURCE.json'
      - 'Makefile'
      - '.github/workflows/frontier596.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, repository baseline pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, repository baseline pin
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install numpy sympy scipy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
      - name: Check selected record and review evidence
        run: |
          python -B scripts/verify_selected_result.py
          python -B scripts/verify_pr_reconciliation.py
      - name: Cold finite replay and exact composition binding
        env:
          CXX: g++
          BOOST_INCLUDE: /usr/include
        run: python -B scripts/verify_frontier596.py --work "$RUNNER_TEMP/frontier596" --jobs 2
      - name: Require committed files unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier596-linux-python312
          path: |
            ${{ runner.temp }}/frontier596/RESULT.json
            ${{ runner.temp }}/frontier596/STEPS.json
            ${{ runner.temp }}/frontier596/*.log
            ${{ runner.temp }}/frontier596/complex/RESULT.json
            ${{ runner.temp }}/frontier596/complex/RECEIPT.json
            ${{ runner.temp }}/frontier596/complex/STAGES.json
            ${{ runner.temp }}/frontier596/complex/ASSEMBLY.json
